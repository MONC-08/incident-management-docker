name: CI/CD

on:
  push:
    branches:
      - main
    
  # pull_request:
  #   branches:
  #     - main
  #     - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-scan-smoke-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker Hub username
        run: |
          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "::error::Set the DOCKERHUB_USERNAME repository variable."
            exit 1
          fi
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}

      - name: Generate backend image tags
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/incident-management-backend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Generate frontend image tags
        id: meta_frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ vars.DOCKERHUB_USERNAME }}/incident-management-frontend
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}

      - name: Build backend image
        run: docker build --tag incident-backend-ci:${GITHUB_SHA} ./backend

      - name: Build frontend image
        run: docker build --tag incident-frontend-ci:${GITHUB_SHA} ./frontend

      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-backend-ci:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: incident-frontend-ci:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Smoke test containers
        shell: bash
        run: |
          set -euo pipefail
          docker network create ci-network
          docker run --detach \
            --name ci-database \
            --network ci-network \
            --env POSTGRES_DB=incidentdb \
            --env POSTGRES_USER=incident_user \
            --env POSTGRES_PASSWORD=ci-password \
            postgres:16-alpine

          for attempt in $(seq 1 30); do
            if docker exec ci-database pg_isready -U incident_user -d incidentdb; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "PostgreSQL did not become ready."
              exit 1
            fi
            sleep 2
          done

          docker run --detach \
            --name ci-backend \
            --network ci-network \
            --network-alias backend \
            --publish 127.0.0.1:5000:5000 \
            --env DB_HOST=ci-database \
            --env DB_PORT=5432 \
            --env DB_NAME=incidentdb \
            --env DB_USER=incident_user \
            --env DB_PASSWORD=ci-password \
            incident-backend-ci:${GITHUB_SHA}
          docker run --detach \
            --name ci-frontend \
            --network ci-network \
            --publish 127.0.0.1:3000:80 \
            incident-frontend-ci:${GITHUB_SHA}

          curl --fail --retry 30 --retry-connrefused --retry-all-errors --retry-delay 2 \
            http://127.0.0.1:5000/health \
            --output backend-health.json
          grep -q '"status":"healthy"' backend-health.json
          curl --fail --retry 30 --retry-connrefused --retry-delay 2 \
            http://127.0.0.1:3000/ --output frontend.html
          grep -qi '<html' frontend.html
          curl --fail http://127.0.0.1:5000/api/incidents

      - name: Show container logs on smoke-test failure
        if: failure()
        run: |
          docker logs ci-backend || true
          docker logs ci-database || true

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta_backend.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "incident-backend-ci:${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Push frontend image tags
        if: github.event_name != 'pull_request'
        env:
          TAGS: ${{ steps.meta_frontend.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker tag "incident-frontend-ci:${GITHUB_SHA}" "$tag"
            docker push "$tag"
          done <<< "$TAGS"

      - name: Clean up smoke-test containers
        if: always()
        run: |
          docker rm --force ci-frontend ci-backend ci-database 2>/dev/null || true
          docker network rm ci-network 2>/dev/null || true
