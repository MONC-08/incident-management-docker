services:
  frontend:
    build:
      target: build
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      NODE_ENV: development
    ports: !override
      - "127.0.0.1:${FRONTEND_PORT:-3000}:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:5173/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
    volumes:
      - ./backend/src:/app/src

volumes:
  frontend_node_modules:
